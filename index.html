  <span class='gv-app-title'>Ficha de Inspección</span><span>☁</span><span style='font-size:25px'>⋮</span></header><nav class='tabs' id='tabs'></nav><main id='main'></main><div id='printAll'></div><div class='bottom'><button class='btn r' onclick='clearAll()'>🗑 NUEVA / LIMPIAR</button><button class='btn g' onclick='save()'>💾 GUARDAR</button><button class='btn' onclick='pdf()'>📄 GENERAR PDF</button></div>
<script>
const T=[['datos','▧ DATOS'],['terreno','▤ TERRENO'],['areas','▥ ÁREAS'],['cons','▧ CONSTR.'],['trag','▥ TRAGALUCES'],['amb','▤ AMBIENTES'],['obras','▧ OBRAS'],['serv','⚙ SERVICIOS'],['fotos','📷 FOTOS']];let page='datos';
let d=JSON.parse(localStorage.getItem('vargoFicha')||'null')||{datos:{fecha:'',hora:'',lugar:'',coord:'',direccion:'',propietario:'',inspector:'',tipo:'',pisos:1,anio:''},terreno:{doc:'',campo:'',frente:'',fondo:'',der:'',izq:'',frentes:1,patio:'',jardin:'',otroLibre:'',patios:'',libre:'',forma:'',topo:'',acceso:''},floors:[],cons:[],trag:[],amb:[],obras:[],serv:{agua:'',aguaDetalle:'',desague:'',desagueDetalle:'',electricidad:'',electricidadDetalle:''},photos:[]};
if(!d.serv)d.serv={agua:'',aguaDetalle:'',desague:'',desagueDetalle:'',electricidad:'',electricidadDetalle:''};
function esc(x){return String(x??'').replace(/&/g,'&amp;').replace(/"/g,'&quot;')}
function num(v){if(v===null||v===undefined||v==='')return 0;let s=String(v).trim().replace(/\s/g,'').replace(',','.');let n=parseFloat(s);return Number.isFinite(n)?n:0}

function set(path,value){
  const p=String(path).split('.');
  let obj=d;
  for(let i=0;i<p.length-1;i++){
    if(obj[p[i]]===undefined || obj[p[i]]===null) obj[p[i]]={};
    obj=obj[p[i]];
  }
  obj[p[p.length-1]]=value;
}

function f(l,k,v,t='text',ex=''){
  const isNum=t==='number';
  const type=isNum?'text':t;
  const mobile=isNum?'inputmode="decimal" autocomplete="off"':'';
  return `<div class='f'><label>${l}</label><input type='${type}' ${mobile} data-k='${k}' value='${esc(v)}' ${ex}></div>`;
}function s(l,k,v,opts){return `<div class='f'><label>${l}</label><select data-k='${k}'><option value=''>Seleccionar...</option>${opts.map(x=>`<option ${v===x?'selected':''}>${x}</option>`).join('')}</select></div>`}function sec(t,b){return `<section class='sec'><h2>${t}</h2><div class='body'>${b}</div></section>`}
function tipoInspeccion(){
  return String(d.datos?.tipo||'').trim().toLowerCase();
}
function tabsPermitidas(){
  const tipo=tipoInspeccion();
  if(tipo==='departamento') return ['datos','amb','fotos'];
  if(tipo==='terreno') return ['datos','terreno','obras','fotos'];
  return T.map(x=>x[0]);
}
function isDepartamento(){return tipoInspeccion()==='departamento'}
function tabPermitida(p){return tabsPermitidas().includes(p)}
function drawTabs(){
  tabs.innerHTML=T.map(x=>{
    const locked=!tabPermitida(x[0]);
    return `<button class='tab ${page==x[0]?'on':''} ${locked?'locked':''}' ${locked?'disabled title="No aplica para departamento"':'onclick=\'go("'+x[0]+'")\''}>${x[1]}${locked?' 🔒':''}</button>`;
  }).join('');
}
function go(p){
  if(!tabPermitida(p)){
    if(isDepartamento()) alert('Para un DEPARTAMENTO, la inspección se limita a DATOS GENERALES, AMBIENTES y FOTOS.');
    return;
  }
  page=p;drawTabs();render();
}
function render(){let a=main;if(page==='datos')datos(a);if(page==='terreno')terreno(a);if(page==='areas'){levels();areas(a)}if(page==='cons')cons(a);if(page==='trag'){levels();trag(a)}if(page==='amb'){levels();amb(a)}if(page==='obras')obras(a);if(page==='serv')serv(a);if(page==='fotos')fotos(a);bind()}
function datos(a){
  const aviso=isDepartamento()?`<div class='dept-notice'><b>DEPARTAMENTO:</b> se habilitan únicamente <b>DATOS GENERALES, AMBIENTES y FOTOS</b>. Las demás secciones quedan bloqueadas porque no forman parte de esta verificación.</div>`:
    tipoInspeccion()==='terreno'?`<div class='dept-notice'><b>TERRENO:</b> se habilitan únicamente <b>DATOS GENERALES, TERRENO, OBRAS y FOTOS</b>. En OBRAS podrás registrar, por ejemplo, cerco perimetral, portón, vereda u otra obra existente; si el terreno está vacío, puedes dejar OBRAS sin registros.</div>`:'';
  a.innerHTML=aviso+sec('1. DATOS GENERALES',`<div class='grid'>${f('Fecha de inspección','datos.fecha',d.datos.fecha,'date')}${f('Hora','datos.hora',d.datos.hora,'time')}${f('Lugar','datos.lugar',d.datos.lugar)}${f('Coordenadas de ubicación','datos.coord',d.datos.coord)}${f('Dirección de la propiedad','datos.direccion',d.datos.direccion,'text','class="full"')}${f('Propietario','datos.propietario',d.datos.propietario)}${f('Inspector','datos.inspector',d.datos.inspector)}${s('Tipo de inmueble','datos.tipo',d.datos.tipo,['Terreno','Vivienda','Departamento','Local comercial','Oficina','Nave industrial','Galpón','Almacén','Taller','Otro'])}${f('Número de pisos','datos.pisos',d.datos.pisos,'number','min="0"')}${f('Año aprox. de construcción','datos.anio',d.datos.anio,'number','min="0"')}</div><p class='hint'>Datos mínimos definidos para la inspección. Las coordenadas pueden escribirse manualmente.</p>`)}
function terreno(a){
  a.innerHTML=sec('2. TERRENO',`<div class='grid'>
  ${f('Área según documentación (m²)','terreno.doc',d.terreno.doc,'number','step="0.01"')}
  ${f('Área verificada en campo (m²)','terreno.campo',d.terreno.campo,'number','step="0.01"')}
  ${f('Frente (m)','terreno.frente',d.terreno.frente,'number','step="0.01"')}
  ${f('Fondo (m)','terreno.fondo',d.terreno.fondo,'number','step="0.01"')}
  ${f('Lado derecho (m)','terreno.der',d.terreno.der,'number','step="0.01"')}
  ${f('Lado izquierdo (m)','terreno.izq',d.terreno.izq,'number','step="0.01"')}
  ${f('N.º de frentes','terreno.frentes',d.terreno.frentes,'number','min="1"')}
  ${s('Forma','terreno.forma',d.terreno.forma,['Regular','Irregular'])}
  ${s('Topografía','terreno.topo',d.terreno.topo,['Plana','Inclinada','Accidentada'])}
  ${s('Tipo de acceso','terreno.acceso',d.terreno.acceso,['Directo','Pasaje','Servidumbre','Otro'])}
  </div><p class='hint'>Aquí se registran las características del lote. Las áreas ocupadas, libres y su distribución están en ÁREAS.</p>`);
}
function levels(){
  const n=Math.max(0,parseInt(d.datos.pisos,10)||0);
  if(!Array.isArray(d.floors)) d.floors=[];
  while(d.floors.length<n){
    d.floors.push({construida:'',tech:'',voladizo:'',libre:'',ocup:'',obs:''});
  }
  if(d.floors.length>n) d.floors=d.floors.slice(0,n);
}function ordinal(n){let x=['1.er piso','2.º piso','3.er piso','4.º piso','5.º piso','6.º piso','7.º piso','8.º piso','9.º piso','10.º piso','11.º piso','12.º piso'];return x[n-1]||n+'.º piso'}
function areas(a){
  const rows=d.floors.map((x,i)=>{
    const c=num(x.construida),t=num(x.tech),v=i===0?0:num(x.voladizo),o=Math.max(0,c-v); x.ocup=o.toFixed(2);
    return `<tr class='area-row'><td>${ordinal(i+1)}</td>
      <td><input type='text' inputmode='decimal' autocomplete='off' data-a='floors' data-i='${i}' data-f='construida' value='${esc(x.construida)}'></td>
      <td><input type='text' inputmode='decimal' autocomplete='off' data-a='floors' data-i='${i}' data-f='tech' value='${esc(x.tech)}'></td>
      <td><input type='text' inputmode='decimal' autocomplete='off' data-a='floors' data-i='${i}' data-f='voladizo' value='${esc(x.voladizo)}' ${i===0?'readonly class="readonly"':''}></td>
      <td><input class='readonly' value='${o.toFixed(2)}' readonly></td>
      <td><input type='text' data-a='floors' data-i='${i}' data-f='obs' value='${esc(x.obs||'')}'></td></tr>`;
  }).join('');
  const built=d.floors.reduce((s,x)=>s+num(x.construida),0),tech=d.floors.reduce((s,x)=>s+num(x.tech),0),vol=d.floors.reduce((s,x)=>s+num(x.voladizo),0),ocup=d.floors.reduce((s,x)=>s+Math.max(0,num(x.construida)-num(x.voladizo)),0);
  const terreno=num(d.terreno.campo||d.terreno.doc), libre=Math.max(0,terreno-num(d.floors[0]?.ocup));
  d.terreno.libre=libre.toFixed(2);
  const patio=num(d.terreno.patio),jardin=num(d.terreno.jardin),otro=num(d.terreno.otroLibre),dist=patio+jardin+otro;
  a.innerHTML=sec('3. ÁREAS DE LA EDIFICACIÓN POR NIVEL',`
  <div class='tablewrap'><table class='tbl'><tr><th>NIVEL</th><th>ÁREA CONSTRUIDA (m²)</th><th>ÁREA TECHADA (m²)</th><th>VOLADIZO (m²)</th><th>ÁREA OCUPADA (m²)</th><th>OBS.</th></tr>${rows}
  <tr><th>TOTAL</th><th id='totalBuilt'>${built.toFixed(2)}</th><th id='totalTech'>${tech.toFixed(2)}</th><th id='totalVol'>${vol.toFixed(2)}</th><th id='totalOcup'>${ocup.toFixed(2)}</th><th></th></tr></table></div>
  <div class='subsection'><h3>ÁREA LIBRE DEL TERRENO</h3><div class='grid'>
    <div class='f'><label>Área ocupada 1.er piso (m²)</label><input class='readonly' id='ocupadaTerreno' value='${num(d.floors[0]?.ocup).toFixed(2)}' readonly></div>
    <div class='f'><label>Área libre (m²)</label><input class='readonly' id='areaLibreCalc' value='${libre.toFixed(2)}' readonly></div>
    ${f('Patio (m²)','terreno.patio',d.terreno.patio||'','number','step="0.01"')}
    ${f('Jardín (m²)','terreno.jardin',d.terreno.jardin||'','number','step="0.01"')}
    ${f('Otro área libre (m²)','terreno.otroLibre',d.terreno.otroLibre||'','number','step="0.01"')}
  </div>
  <div class='sum'><b>Área libre disponible:</b> <span id='libreDisponible'>${libre.toFixed(2)}</span> m² &nbsp;|&nbsp; <b>Distribución registrada:</b> <span id='libreDistribuido'>${dist.toFixed(2)}</span> m²</div>
  <div id='libreAlert' class='warn' style='display:${dist>libre+0.0001?'block':'none'}'>⚠️ La distribución (${dist.toFixed(2)} m²) supera el área libre disponible (${libre.toFixed(2)} m²).</div>
  <p class='hint'>Área libre = terreno − área ocupada del primer piso. Patio, jardín y otro son componentes del área libre.</p></div>
  <div class='sum'><b>Área construida total:</b> ${built.toFixed(2)} m² | <b>Área techada:</b> ${tech.toFixed(2)} m² | <b>Voladizos:</b> ${vol.toFixed(2)} m² | <b>Área ocupada:</b> ${ocup.toFixed(2)} m²</div>`);
}

function updateTragTotalsOnly(inputEl){
  const card=inputEl.closest(".card");
  if(!card)return;
  const cards=[...document.querySelectorAll(".tragaluz-card")];
  const idx=cards.indexOf(card);
  if(idx<0 || !d.trag[idx])return;

  const x=d.trag[idx];
  const ancho=num(x.ancho);
  const largo=num(x.largo);
  const area=ancho*largo;

  const maxP=Math.max(1,+d.datos.pisos||1);
  const ini=Math.max(1,Math.min(maxP,+x.inicio||1));
  const fin=Math.max(ini,Math.min(maxP,+x.fin||ini));
  const niveles=fin-ini+1;

  const sum=card.querySelector(".sum");
  if(sum){
    sum.innerHTML=`<b>Resultado:</b> ${ancho.toFixed(2)} × ${largo.toFixed(2)} = <b>${area.toFixed(2)} m²</b> &nbsp; | &nbsp; Desde <b>${ordinal(ini)}</b> hasta <b>${ordinal(fin)}</b> &nbsp; | &nbsp; ${niveles} nivel(es)`;
  }

  const readonly=card.querySelectorAll("input.readonly");
  if(readonly[0]) readonly[0].value=area.toFixed(2);
  if(readonly[1]) readonly[1].value=niveles;

  const total=d.trag.reduce((s,t)=>s+num(t.ancho)*num(t.largo),0);
  const totalEl=document.getElementById("tragTotal");
  if(totalEl){
    totalEl.innerHTML=`<b>Área total de tragaluces:</b> ${total.toFixed(2)} m² &nbsp; | &nbsp; <b>Cantidad:</b> ${d.trag.length}`;
  }
}
function updateObraCapacityOnly(inputEl){

  const cards=[...document.querySelectorAll(".obra-card")];

  if(idx<0 || !d.obras[idx])return;

  const obra=d.obras[idx];
  const tipo=obra.tipo||'';
  const volumen=num(obra.volumen);
  const litros=volumen*1000;

  const litrosInput=card.querySelector(".obra-litros");

function bind(){
  document.querySelectorAll("[data-k]").forEach(e=>{
    const handler=()=>{
      const key=e.dataset.k;
      const v=e.value;
      if(key.startsWith("t.")){
        const card=e.closest(".tragaluz-card");
        const cards=[...document.querySelectorAll(".tragaluz-card")];
        const idx=card ? cards.indexOf(card) : -1;
        if(idx>=0 && d.trag[idx]){ d.trag[idx][key.slice(2)]=v; updateTragTotalsOnly(e); }
      }else if(key.startsWith("c.")){
        const card=e.closest(".construction-card");
        const cards=[...document.querySelectorAll(".construction-card")];
        const idx=card ? cards.indexOf(card) : -1;
        if(idx>=0 && d.cons[idx]) d.cons[idx][key.slice(2)]=v;
      }else if(key.startsWith("o.")){
        const card=e.closest(".obra-card");
        const cards=[...document.querySelectorAll(".obra-card")];
        const idx=card ? cards.indexOf(card) : -1;
        if(idx>=0 && d.obras[idx]){
          d.obras[idx][key.slice(2)]=v;
          if(key==="o.volumen" || key==="o.longitud" || key==="o.altura" || key==="o.med") updateObraCapacityOnly(e);
        }
      }else if(key.startsWith("serv.")){
        if(!d.serv) d.serv={};
        d.serv[key.slice(5)]=v;
      }else{
        set(key,v);
        if(key.startsWith("terreno.")) updateTerrainCalculatedFields();
      }
      save(false);
    };
    e.addEventListener("input",handler);
    e.addEventListener("change",handler);
    if(e.dataset.k==="datos.tipo"){
      e.addEventListener("change",()=>{
        const tipo=tipoInspeccion();
        if(tipo==='departamento'){
          d.terreno={doc:'',campo:'',frente:'',fondo:'',der:'',izq:'',frentes:1,patio:'',jardin:'',otroLibre:'',patios:'',libre:'',forma:'',topo:'',acceso:''};
          d.floors=[]; d.cons=[]; d.trag=[]; d.obras=[];
        }else if(tipo==='terreno'){
          d.floors=[]; d.cons=[]; d.trag=[]; d.amb=[]; d.obras=[]; d.serv={agua:'',aguaDetalle:'',desague:'',desagueDetalle:'',electricidad:'',electricidadDetalle:''};
        }
        save(false);
        if(!tabPermitida(page)) page='datos';
        drawTabs();
        render();
      });
    }
    if(e.dataset.k==="datos.pisos"){
      e.addEventListener("change",()=>{levels();if(page==="areas"||page==="trag"||page==="amb")render();});
    }
    if(e.dataset.k==="o.tipo"){
      e.addEventListener("change",()=>{save(false);render();});
    }
  });
  document.querySelectorAll("[data-a]").forEach(e=>e.addEventListener("input",()=>{
    const v=e.value;
    d[e.dataset.a][+e.dataset.i][e.dataset.f]=v;
    if(page==="areas"){updateAreaTotalsOnly();updateTerrainCalculatedFields();}
    save(false);
  }));
}
function updateTerrainCalculatedFields(){
  const terreno=num(d.terreno.campo||d.terreno.doc);
  const ocupada=num(d.floors[0]?.ocup);
  const libre=Math.max(0,terreno-ocupada);
  d.terreno.libre=libre.toFixed(2);
  const occ=document.getElementById("ocupadaTerreno");
  const al=document.getElementById("areaLibreCalc");
  const ld=document.getElementById("libreDisponible");
  const lr=document.getElementById("libreDistribuido");
  const alert=document.getElementById("libreAlert");
  if(occ)occ.value=ocupada.toFixed(2);
  if(al)al.value=libre.toFixed(2);
  if(ld)ld.textContent=libre.toFixed(2);
  const dist=num(d.terreno.patio)+num(d.terreno.jardin)+num(d.terreno.otroLibre);
  if(lr)lr.textContent=dist.toFixed(2);
  if(alert){
    alert.style.display=dist>libre+0.0001?'block':'none';
    alert.textContent=dist>libre+0.0001?`⚠️ La distribución del área libre (${dist.toFixed(2)} m²) supera el área libre disponible (${libre.toFixed(2)} m²).`:'';
  }
}

  let cc=0,tt=0,vv=0,oo=0;
  d.floors.forEach((x,i)=>{
    const c=num(x.construida), t=num(x.tech), v=i===0?0:num(x.voladizo), o=Math.max(0,c-v);
    x.ocup=o.toFixed(2); cc+=c;tt+=t;vv+=v;oo+=o;
  });
  if(document.getElementById("totalBuilt")) document.getElementById("totalBuilt").textContent=cc.toFixed(2);
  if(document.getElementById("totalTech")) document.getElementById("totalTech").textContent=tt.toFixed(2);
  if(document.getElementById("totalVol")) document.getElementById("totalVol").textContent=vv.toFixed(2);
  if(document.getElementById("totalOcup")) document.getElementById("totalOcup").textContent=oo.toFixed(2);
  const inp=document.querySelector('[data-a="floors"][data-i="0"][data-f="ocup"]');
  if(inp)inp.value=d.floors[0]?.ocup||'0.00';
  updateTerrainCalculatedFields();
}
function save(show=true){localStorage.setItem('vargoFicha',JSON.stringify(d));if(show)alert('Ficha guardada correctamente en este dispositivo.')}function clearAll(){if(confirm('¿Borrar toda la ficha?')){localStorage.removeItem('vargoFicha');location.reload()}}function makePrintClean(source){
  const clone=source.cloneNode(true);

  clone.querySelectorAll("button,.btn,.hint,.noprint,.delete,.r").forEach(x=>x.remove());

  clone.querySelectorAll("input,select,textarea").forEach(el=>{
    let value="";
    if(el.tagName==="SELECT"){
      const opt=el.options[el.selectedIndex];
      value=opt ? opt.textContent.trim() : "";
    }else{
      value=el.value || el.getAttribute("value") || "";
    }
    const span=document.createElement("span");
    span.textContent=value;
    span.className="print-value";
    el.replaceWith(span);
  });

  clone.querySelectorAll("[contenteditable='true']").forEach(el=>{
    const span=document.createElement("span");
    span.textContent=el.textContent.trim();
    el.replaceWith(span);
  });

  return clone;
}

  print.appendChild(cover);

  levels();

  let sections;
  if(tipo==='departamento'){
    sections=[
      ["datos",datos],
      ["amb",amb]
    ];
  }else if(tipo==='terreno'){
    sections=[
      ["datos",datos],
      ["terreno",terreno],
      ["obras",obras]
    ];
  }else{
    sections=[
      ["datos",datos],
      ["terreno",terreno],
      ["areas",areas],
      ["cons",cons],
      ["trag",trag],
      ["amb",amb],
      ["obras",obras],
      ["serv",serv]
    ];
  }

  sections.forEach(([key,fn])=>{
    const holder=document.createElement("div");
    fn(holder);
    const clean=makePrintClean(holder);
    clean.querySelectorAll('.dept-notice').forEach(x=>x.remove());
    print.appendChild(clean);
  });

  const photoSection=document.createElement("section");
  photoSection.className="sec";
  const photoFolders=[
    {id:"fachada",label:"0. FACHADA"},
    {id:"medidor",label:"1. MEDIDOR"},
    {id:"interior",label:"2. INTERIOR"},
    {id:"referencias",label:"REFERENCIAS"}
  ];
  let photoHtml=`<h2>8. FOTOGRAFÍAS</h2><div class="body">`;
  if(!d.photos || !d.photos.length){
    photoHtml+=`<p>No se registraron fotografías.</p>`;
  }else{
    photoFolders.forEach(folder=>{
      const items=d.photos.map((p,i)=>({...p,i})).filter(p=>(p.folder||"fachada")===folder.id);
      if(!items.length)return;
      photoHtml+=`<div class="photo-pdf-folder"><h3>${folder.label}</h3><div class="photo-pdf-grid">`;
      items.forEach(p=>{
        photoHtml+=`<div class="photo">
          <div><b>Foto ${p.i+1}</b></div>
          ${(p.folder||"fachada")==="referencias" ? `
          ${p.area?`<div><b>Área:</b> ${esc(p.area)} m²</div>`:""}
          ${p.coord?`<div><b>Coordenadas:</b> ${esc(p.coord)}</div>`:""}
          ${p.cel?`<div><b>Celular / teléfono:</b> ${esc(p.cel)}</div>`:""}
          ${p.precio?`<div><b>Precio:</b> ${esc(p.precio)}</div>`:""}
          ${p.entorno?`<div><b>Descripción del entorno:</b> ${esc(p.entorno)}</div>`:""}
          ` : `
          ${p.desc?`<div><b>Descripción:</b> ${esc(p.desc)}</div>`:""}
          ${p.ubi?`<div><b>Ubicación:</b> ${esc(p.ubi)}</div>`:""}`}
          <img src="${p.src}" alt="Foto ${p.i+1}">
        </div>`;
      });
      photoHtml+=`</div></div>`;
    });
  }
  photoHtml+=`</div>`;
  photoSection.innerHTML=photoHtml;
  print.appendChild(photoSection);

  const footer=document.createElement("div");
  footer.className="print-footer";
  footer.textContent="Grupo Vargo · Ficha de inspección · Documento generado a partir de la información registrada en la inspección.";
  print.appendChild(footer);

  document.body.classList.add("printingAll");
  const cleanup=()=>{
    document.body.classList.remove("printingAll");
    print.innerHTML="";
    page=originalPage;
    drawTabs();
    render();
    window.removeEventListener("afterprint",cleanup);
  };
  window.addEventListener("afterprint",cleanup);
  setTimeout(()=>window.print(),150);
}

drawTabs();render();updateTerrainCalculatedFields();

function normalizeDecimalValue(v){
  if (typeof v !== "string") return v;
  return v.replace(",", ".");
}
